            </h1>
            <p className="mt-4 text-base sm:text-lg text-slate-600 max-w-2xl mx-auto font-medium">
              더미 이미지가 아닌 실제 공식 오리지널 영화 포스터로 더욱 생생하게! 장르별 10편씩 총 40편의 대표작을 만나보세요.
            </p>
          </section>

          {/* 컨트롤 바: 장르 탭 & 검색 & 정렬 */}
          <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-2 mb-8">
            <div className="bg-white/90 border border-slate-200/90 rounded-3xl p-4 sm:p-5 backdrop-blur-md shadow-canva-card flex flex-col md:flex-row gap-4 items-center justify-between">
              
              {/* 장르 탭 (각 10편씩 표기) */}
              <div className="flex items-center gap-2 overflow-x-auto w-full md:w-auto pb-1 md:pb-0 scrollbar-none">
                {GENRES.map((genre) => {
                  const isActive = selectedGenre === genre;
                  const count = genreCounts[genre] || 0;
                  const style = GENRE_STYLES[genre] || GENRE_STYLES["전체"];
                  return (
                    <button
                      key={genre}
                      onClick={() => setSelectedGenre(genre)}
                      className={`relative flex items-center gap-2 px-4 py-2 rounded-2xl text-sm font-bold transition-all duration-200 whitespace-nowrap cursor-pointer ${
                        isActive
                          ? `bg-gradient-to-r ${style.activeTab} scale-100`
                          : "text-slate-600 hover:text-slate-900 hover:bg-slate-100/80 bg-slate-50 border border-slate-200/60"
                      }`}
                    >
                      <span>{genre}</span>
                      <span className={`text-xs px-2 py-0.5 rounded-full font-black ${
                        isActive ? "bg-white/25 text-white" : "bg-white text-slate-500 border border-slate-200"
                      }`}>
                        {count}편
                      </span>
                    </button>
                  );
                })}
              </div>

              {/* 검색창 & 정렬 */}
              <div className="flex items-center gap-3 w-full md:w-auto">
                <div className="relative flex-1 md:w-64">
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="제목, 감독, 줄거리 검색..."
                    className="w-full bg-slate-50/90 border border-slate-200 focus:border-[#7d2ae8] rounded-2xl px-4 py-2 pl-10 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-purple-500/10 transition-all font-medium"
                  />
                  <svg className="w-4 h-4 text-slate-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                  </svg>
                  {searchQuery && (
                    <button 
                      onClick={() => setSearchQuery("")}
                      className="absolute right-3 top-2.5 text-xs text-slate-400 hover:text-slate-600"
                    >
                      ✕
                    </button>
                  )}
                </div>

                <select
                  value={sortBy}
                  onChange={(e) => setSortBy(e.target.value)}
                  className="bg-slate-50/90 border border-slate-200 text-slate-700 text-sm font-semibold rounded-2xl px-3 py-2 focus:border-[#7d2ae8] focus:outline-none focus:ring-4 focus:ring-purple-500/10 cursor-pointer"
                >
                  <option value="rating">평점 높은순</option>
                  <option value="year">최신 개봉순</option>
                  <option value="title">가나다순</option>
                </select>
              </div>
            </div>
          </section>

          {/* 영화 카드 그리드 */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex items-center justify-between mb-6">
              <div className="flex items-center gap-2.5">
                <h2 className="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">
                  {selectedGenre} 영화 목록
                </h2>
                <span className="text-xs font-bold text-[#7d2ae8] bg-purple-50 border border-purple-200 px-2.5 py-0.5 rounded-full">
                  {filteredMovies.length}개 작품 표시 중
                </span>
              </div>
              {selectedGenre !== "전체" && (
                <button
                  onClick={() => setSelectedGenre("전체")}
                  className="text-xs font-bold text-[#00c4cc] hover:text-[#009da3] transition-colors"
                >
                  ← 전체 40편 보기
                </button>
              )}
            </div>

            {/* 결과 없음 */}
            {filteredMovies.length === 0 ? (
              <div className="py-20 text-center bg-white rounded-3xl border border-slate-200/90 shadow-sm">
                <div className="w-16 h-16 mx-auto mb-4 rounded-2xl bg-purple-50 flex items-center justify-center text-[#7d2ae8]">
                  <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                </div>
                <h3 className="text-lg font-bold text-slate-800">일치하는 영화가 없습니다</h3>
                <p className="text-sm text-slate-500 mt-1 max-w-sm mx-auto">
                  다른 검색어를 입력하시거나 다른 장르 탭을 눌러보세요.
                </p>
                <button
                  onClick={() => { setSelectedGenre("전체"); setSearchQuery(""); }}
                  className="mt-5 px-5 py-2.5 rounded-2xl text-xs font-bold bg-gradient-to-r from-[#00c4cc] to-[#7d2ae8] text-white shadow-md hover:opacity-95"
                >
                  전체 영화 40편 보기
                </button>
              </div>
            ) : (
              /* 캔바 감성 카드 그리드 */
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 sm:gap-7">
                {filteredMovies.map((movie) => {
                  const isLiked = likedMovieIds.has(movie.id);
                  const genreStyle = GENRE_STYLES[movie.genre] || GENRE_STYLES["전체"];
                  return (
                    <article
                      key={movie.id}
                      onClick={() => { setActiveModalMovie(movie); setIsRandomPickModal(false); }}
                      className="group bg-white rounded-3xl overflow-hidden border border-slate-200/80 shadow-canva-card hover:shadow-canva-hover hover:-translate-y-2 transition-all duration-300 flex flex-col cursor-pointer relative"
                    >
                      {/* 포스터 이미지 (실제 공식 포스터) */}
                      <div className="relative aspect-[2/3] w-full overflow-hidden bg-slate-100">
                        <img
                          src={movie.poster}
                          alt={`${movie.title} 공식 포스터`}
                          referrerPolicy="no-referrer"
                          loading="lazy"
                          className="w-full h-full object-cover object-top group-hover:scale-105 transition-transform duration-500 ease-out"
                          onError={(e) => {
                            // 안전한 폴백
                            e.target.onerror = null;
                            e.target.src = "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=650&q=80";
                          }}
                        />
                        {/* 은은한 그라데이션 오버레이 */}
                        <div className="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent to-transparent opacity-80 group-hover:opacity-60 transition-opacity" />

                        {/* 상단 뱃지: 장르 & 개봉연도 */}
                        <div className="absolute top-3 left-3 flex items-center gap-1.5 z-10">
                          <span className={`px-2.5 py-1 rounded-xl text-xs font-black tracking-wide border shadow-sm backdrop-blur-md ${genreStyle.badge}`}>
                            {movie.genre}
                          </span>
                          <span className="px-2 py-1 rounded-xl text-xs font-bold bg-white/80 text-slate-700 backdrop-blur-md shadow-sm">
                            {movie.year}
                          </span>
                        </div>

                        {/* 우측 상단 찜하기 버튼 */}
                        <button
                          onClick={(e) => toggleLike(movie.id, e)}
                          title={isLiked ? "찜 해제" : "위시리스트 추가"}
                          className="absolute top-3 right-3 z-10 p-2 rounded-xl bg-white/90 hover:bg-white text-slate-400 hover:text-[#ff4f79] backdrop-blur-md shadow-md transition-all hover:scale-110"
                        >
                          <IconHeart filled={isLiked} />
                        </button>

                        {/* 포스터 하단 평점 & 런타임 */}
                        <div className="absolute bottom-3 left-3 right-3 flex items-center justify-between text-xs z-10">
                          <div className="flex items-center gap-1 px-2.5 py-1 rounded-xl bg-white/95 text-slate-800 shadow-md font-bold">
                            <IconStar />
                            <span>{movie.rating.toFixed(1)}</span>
                          </div>
                          <span className="text-white text-xs font-semibold bg-black/50 px-2 py-1 rounded-xl backdrop-blur-md">
                            {movie.runtime}
                          </span>
                        </div>
                      </div>

                      {/* 영화 정보 텍스트 */}
                      <div className="p-5 flex-1 flex flex-col justify-between bg-white">
                        <div>
                          <h3 className="text-lg font-black text-slate-900 group-hover:text-[#7d2ae8] transition-colors line-clamp-1 mb-1">
                            {movie.title}
                          </h3>
                          <p className="text-xs text-slate-500 font-medium mb-3 line-clamp-1">
                            {movie.englishTitle} · {movie.director}
                          </p>
                          <p className="text-sm text-slate-600 leading-relaxed line-clamp-2 font-normal">
                            {movie.summary}
                          </p>
                        </div>

                        {/* 카드 하단 */}
                        <div className="mt-4 pt-3.5 border-t border-slate-100 flex items-center justify-between">
                          <div className="flex flex-wrap gap-1">
                            {movie.tags.slice(0, 2).map((tag, idx) => (
                              <span key={idx} className="text-[11px] font-semibold text-[#7d2ae8] bg-purple-50 px-2 py-0.5 rounded-lg">
                                #{tag}
                              </span>
                            ))}
                          </div>
                          <span className="text-xs font-bold text-[#00c4cc] group-hover:text-[#7d2ae8] group-hover:translate-x-1 transition-all inline-flex items-center gap-1">
                            자세히 <span>→</span>
                          </span>
                        </div>
                      </div>
                    </article>
                  );
                })}
              </div>
            )}
          </main>

          {/* ============================================================== */}
          {/* 모달 1: 캔바 스타일 셔플링 애니메이션 */}
          {/* ============================================================== */}
          {isShuffling && shufflingMovie && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md animate-fade-in">
              <div className="bg-white border border-purple-200 rounded-3xl p-8 max-w-sm w-full text-center shadow-canva-modal animate-scale-up">
                <div className="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-tr from-[#00c4cc] via-[#5b40e7] to-[#7d2ae8] flex items-center justify-center text-white shadow-lg shadow-purple-500/30 animate-spin">
                  <IconDice />
                </div>
                <h3 className="text-xl font-black text-slate-900 mb-1">
                  오늘의 영화를 고르는 중!
                </h3>
                <p className="text-xs text-[#7d2ae8] font-bold mb-5">
                  총 40편의 공식 명작 포스터 중 최적의 작품을 추첨하고 있습니다
                </p>
                <div className="relative aspect-[3/4] w-48 mx-auto rounded-2xl overflow-hidden border-2 border-[#7d2ae8] shadow-lg mb-4 bg-slate-100">
                  <img
                    src={shufflingMovie.poster}
                    alt={shufflingMovie.title}
                    referrerPolicy="no-referrer"
                    className="w-full h-full object-cover object-top"
                  />
                  <div className="absolute inset-0 bg-gradient-to-t from-black/85 via-transparent to-transparent flex items-end p-3">
                    <p className="text-sm font-black text-white w-full text-center">
                      {shufflingMovie.title}
                    </p>
                  </div>
                </div>
                <div className="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                  <div className="bg-gradient-to-r from-[#00c4cc] to-[#7d2ae8] h-2 rounded-full animate-pulse w-full"></div>
                </div>
              </div>
            </div>
          )}

          {/* ============================================================== */}
          {/* 모달 2: 영화 상세 & 랜덤 추천 팝업 (캔바 팔레트) */}
          {/* ============================================================== */}
          {activeModalMovie && !isShuffling && (
            <div 
              className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-slate-900/60 backdrop-blur-md animate-fade-in"
              onClick={closeModal}
            >
              <div 
                className="relative w-full max-w-2xl bg-white border border-purple-100 rounded-3xl overflow-hidden shadow-canva-modal animate-scale-up"
                onClick={(e) => e.stopPropagation()}
              >
                {/* 닫기 버튼 */}
                <button
                  onClick={closeModal}
                  className="absolute top-4 right-4 z-20 w-9 h-9 rounded-full bg-white/90 hover:bg-white text-slate-600 hover:text-slate-900 shadow-md border border-slate-200 flex items-center justify-center transition-colors"
                >
                  ✕
                </button>

                {/* 캔바 무드의 추천 당첨 헤더 배너 */}
                {isRandomPickModal && (
                  <div className="bg-gradient-to-r from-[#00c4cc] via-[#5b40e7] to-[#7d2ae8] px-6 py-3.5 flex items-center justify-between text-white">
                    <div className="flex items-center gap-2 font-black text-sm sm:text-base">
                      <span className="text-lg">🎉</span>
                      <span>오늘 당신을 위한 캔바 픽 추천 영화!</span>
                    </div>
                    <span className="text-xs bg-white/20 text-white px-2.5 py-0.5 rounded-full font-bold">
                      추천도 99%
                    </span>
                  </div>
                )}

                <div className="p-6 sm:p-8 flex flex-col md:flex-row gap-6">
                  {/* 포스터 영역 (실제 포스터) */}
                  <div className="w-full md:w-5/12 flex-shrink-0">
                    <div className="relative aspect-[2/3] w-full rounded-2xl overflow-hidden shadow-md border border-slate-200 bg-slate-100">
                      <img
                        src={activeModalMovie.poster}
                        alt={activeModalMovie.title}
                        referrerPolicy="no-referrer"
                        className="w-full h-full object-cover object-top"
                      />
                      <div className="absolute bottom-2 left-2 right-2 flex justify-between items-center bg-white/90 backdrop-blur-md px-3 py-1.5 rounded-xl border border-slate-200 text-slate-800 shadow-sm">
                        <div className="flex items-center gap-1 font-bold text-sm">
                          <IconStar />
                          <span>{activeModalMovie.rating.toFixed(1)}</span>
                        </div>
                        <span className="text-xs text-slate-600 font-semibold">
                          {activeModalMovie.runtime}
                        </span>
                      </div>
                    </div>
                  </div>

                  {/* 상세 텍스트 */}
                  <div className="flex-1 flex flex-col justify-between">
                    <div>
                      {/* 장르 뱃지 */}
                      <div className="flex items-center gap-2 mb-2">
                        <span className={`px-2.5 py-0.5 rounded-lg text-xs font-black border ${
                          (GENRE_STYLES[activeModalMovie.genre] || GENRE_STYLES["전체"]).badge
                        }`}>
                          {activeModalMovie.genre}
                        </span>
                        <span className="text-xs text-slate-500 font-semibold">
                          {activeModalMovie.year}년 개봉
                        </span>
                      </div>

                      {/* 제목 */}
                      <h2 className="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight mb-1">
                        {activeModalMovie.title}
                      </h2>
                      <p className="text-xs sm:text-sm text-slate-500 font-medium mb-4">
                        {activeModalMovie.englishTitle}
                      </p>

                      {/* 큐레이터 추천평 */}
                      {isRandomPickModal && activeModalMovie.recommendReason && (
                        <div className="mb-4 p-3.5 rounded-2xl bg-gradient-to-r from-purple-50 to-pink-50 border border-purple-200/80 text-xs sm:text-sm text-slate-800">
                          <span className="font-bold text-[#7d2ae8]">💡 큐레이터 한줄평:</span>{" "}
                          {activeModalMovie.recommendReason}
                        </div>
                      )}

                      {/* 시놉시스 */}
                      <div className="mb-4">
                        <h4 className="text-xs uppercase tracking-wider text-slate-400 font-bold mb-1.5">
                          시놉시스
                        </h4>
                        <p className="text-sm text-slate-600 leading-relaxed max-h-36 overflow-y-auto pr-2">
                          {activeModalMovie.summary}
                        </p>
                      </div>

                      {/* 감독 & 출연진 */}
                      <div className="space-y-1.5 text-xs text-slate-500 border-t border-slate-100 pt-3">
                        <p><strong className="text-slate-800 font-semibold">감독:</strong> {activeModalMovie.director}</p>
                        <p><strong className="text-slate-800 font-semibold">출연:</strong> {activeModalMovie.cast}</p>
                      </div>

                      {/* 태그 */}
                      <div className="mt-3 flex flex-wrap gap-1.5">
                        {activeModalMovie.tags.map((tag, idx) => (
                          <span key={idx} className="text-xs font-semibold text-[#7d2ae8] bg-purple-50 px-2.5 py-0.5 rounded-lg">
                            #{tag}
                          </span>
                        ))}
                      </div>
                    </div>

                    {/* 모달 하단 버튼 액션 */}
                    <div className="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between gap-3">
                      <button
                        onClick={(e) => toggleLike(activeModalMovie.id, e)}
                        className={`flex items-center gap-2 px-4 py-2.5 rounded-2xl text-xs font-bold transition-all border ${
                          likedMovieIds.has(activeModalMovie.id)
                            ? "bg-[#fff0f4] text-[#ff4f79] border-[#ff4f79]/30"
                            : "bg-slate-50 hover:bg-slate-100 text-slate-600 border-slate-200"
                        }`}
                      >
                        <IconHeart filled={likedMovieIds.has(activeModalMovie.id)} />
                        <span>{likedMovieIds.has(activeModalMovie.id) ? "찜한 영화" : "위시리스트"}</span>
                      </button>

                      {isRandomPickModal ? (
                        <div className="flex items-center gap-2">
                          <button
                            onClick={triggerRandomRecommendation}
                            className="px-4 py-2.5 rounded-2xl text-xs font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 transition-colors flex items-center gap-1.5"
                          >
                            <span>🎲 다시 뽑기</span>
                          </button>
                          <button
                            onClick={closeModal}
                            className="px-5 py-2.5 rounded-2xl text-xs font-bold text-white bg-gradient-to-r from-[#00c4cc] to-[#7d2ae8] hover:opacity-95 shadow-md shadow-purple-500/25 transition-all"
                          >
                            이 영화로 결정!
                          </button>
                        </div>
                      ) : (
                        <button
                          onClick={closeModal}
                          className="px-5 py-2.5 rounded-2xl text-xs font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 transition-colors"
                        >
                          닫기
                        </button>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 푸터 */}
          <footer className="mt-24 border-t border-slate-200 text-center py-8 text-xs text-slate-400">
            <p className="font-semibold text-slate-500">© 2026 CinePick · Official Posters & Canva Theme Edition</p>
            <p className="mt-1">액션 10편 · 코미디 10편 · 드라마 10편 · SF 10편 총 40편의 공식 오리지널 포스터가 수록되어 있습니다.</p>
          </footer>
        </div>
      );
    }

    // React 18 루트 렌더링
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
